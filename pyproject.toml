[project]
name = "ics-mcp"
version = "0.1.0"
description = "MCP server for ICS (Internal Content Sharing): read, write, version and share ICS assets from AI assistants"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "inProjects spółka z o.o. sp.k.", email = "info@inprojects.pl" }]
keywords = ["mcp", "model-context-protocol", "ics", "fastmcp", "oauth", "markdown", "content-sharing", "ai-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: File Sharing",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastmcp==3.4.10",
    "httpx[http2]>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.14.2",
    "cryptography>=50",
    "keyring>=24",
    "platformdirs>=4",
    "structlog>=24",
    "anyio>=4.14.2",
]

[project.urls]
Homepage = "https://github.com/inprojectspl/ics-mcp"
Repository = "https://github.com/inprojectspl/ics-mcp"
Issues = "https://github.com/inprojectspl/ics-mcp/issues"
Changelog = "https://github.com/inprojectspl/ics-mcp/blob/main/CHANGELOG.md"

[project.scripts]
ics-mcp = "ics_mcp.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ics_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
